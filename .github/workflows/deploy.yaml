name: Deploy Quartz to Neocities

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-to-neocities
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The endpoint is public, so keep a working default in the workflow.
    # A repository variable or secret can override it when the server changes.
    env:
      WALINE_SERVER_URL: ${{ vars.WALINE_SERVER_URL || secrets.WALINE_SERVER_URL || 'https://waline-comment-cds2jczdz-floralchai.vercel.app' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz
        run: npm run build

      - name: Verify generated homepage and comment system before deployment
        run: |
          if [ -z "${WALINE_SERVER_URL:-}" ]; then
            echo "::error::Set WALINE_SERVER_URL under repository Actions Variables or Secrets to your deployed Waline server URL."
            exit 1
          fi
          test -s public/index.html
          grep -q "Welcome to Tawny Flor" public/index.html
          grep -q "portfolio-top-nav" public/index.html
          test "$(grep -o 'class="site-header-banner"' public/index.html | wc -l)" -eq 1
          test "$(grep -o 'class="portfolio-top-nav"' public/index.html | wc -l)" -eq 1
          grep -q 'class="waline-comments"' public/index.html
          grep -q 'id="waline-comments-mount"' public/index.html
          grep -R -Fq "${WALINE_SERVER_URL%/}" public/static/scripts
          grep -R -q "https://unpkg.com/@waline/client@v3/dist/waline.js" public/static/scripts
          ! grep -qi 'hyvor-talk-comments\|giscus' public/index.html
          test -s public/static/waline-emoji/tf_flower.svg
          grep -R -q --include='*.css' -- '--wiki-red' public

      - name: Verify Neocities API token belongs to tawnyflor
        env:
          NEOCITIES_API_TOKEN: ${{ secrets.NEOCITIES_API_TOKEN }}
        run: |
          SITE_INFO="$(curl -fsS -H "Authorization: Bearer ${NEOCITIES_API_TOKEN}" https://neocities.org/api/info)"
          echo "$SITE_INFO" | jq -e '.info.sitename == "tawnyflor"' >/dev/null || {
            echo "::error::NEOCITIES_API_TOKEN is not the API key for tawnyflor.neocities.org. Update the repository secret from https://neocities.org/settings/tawnyflor#api_key."
            exit 1
          }
          echo "Confirmed: deployment token belongs to tawnyflor.neocities.org."

      - name: Deploy to Neocities
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_TOKEN }}
          dist_dir: public
          cleanup: true
          neocities_supporter: false
          preview_before_deploy: true
