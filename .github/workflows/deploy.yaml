name: Deploy Quartz to Neocities

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-to-neocities
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz
        run: npm run build

      - name: Verify generated homepage and theme
        run: |
          test -s public/index.html
          grep -q "Welcome to Tawny Flor" public/index.html
          grep -q "portfolio-top-nav" public/index.html
          grep -q "portfolio-sidebar-nav" public/index.html
          grep -q 'href="/Welcome"' public/index.html
          grep -q 'href="/README"' public/index.html
          grep -R -q --include='*.css' -- '--wiki-red' public

      - name: Verify Neocities API token belongs to tawnyflor
        env:
          NEOCITIES_API_TOKEN: ${{ secrets.NEOCITIES_API_TOKEN }}
        run: |
          SITE_INFO="$(curl -fsS -H "Authorization: Bearer ${NEOCITIES_API_TOKEN}" https://neocities.org/api/info)"
          echo "$SITE_INFO" | jq -e '.info.sitename == "tawnyflor"' >/dev/null || {
            echo "::error::NEOCITIES_API_TOKEN is not the API key for tawnyflor.neocities.org. Update the repository secret from https://neocities.org/settings/tawnyflor#api_key."
            exit 1
          }
          echo "Confirmed: deployment token belongs to tawnyflor.neocities.org."

      - name: Deploy to Neocities
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_TOKEN }}
          dist_dir: public
          cleanup: false
          neocities_supporter: false
          preview_before_deploy: true

      - name: Verify live Neocities homepage
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 15 https://tawnyflor.neocities.org/ -o /tmp/tawnyflor-home.html; then
              if grep -q "Welcome to Tawny Flor" /tmp/tawnyflor-home.html &&
                 grep -q "portfolio-top-nav" /tmp/tawnyflor-home.html &&
                 grep -q "portfolio-sidebar-nav" /tmp/tawnyflor-home.html; then
                echo "Verified live homepage, theme navigation and sidebar on tawnyflor.neocities.org."
                exit 0
              fi
            fi
            echo "Live site not updated yet (attempt $attempt/12); retrying..."
            sleep 5
          done
          echo "::error::The deployed homepage could not be verified at https://tawnyflor.neocities.org/."
          exit 1
