name: Verify Quartz pull requests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz
        run: npm run build

      - name: Verify homepage, single header, and comment widget
        run: |
          test -s public/index.html
          grep -q "Welcome to Tawny Flor" public/index.html
          test "$(grep -o 'class="site-header-banner"' public/index.html | wc -l)" -eq 1
          test "$(grep -o 'class="portfolio-top-nav"' public/index.html | wc -l)" -eq 1
          grep -q 'class="giscus"' public/index.html
          grep -q 'data-repo-id="R_kgDOVl2v_A"' public/index.html
          grep -q 'data-category-id="REPLACE_WITH_GISCUS_CATEGORY_ID"' public/index.html
          test -s public/static/giscus/pastel-light.css
          test -s public/static/giscus/pastel-dark.css
          grep -R -q --include='*.css' -- '--wiki-red' public
