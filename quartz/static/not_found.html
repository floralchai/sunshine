<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5fc">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>404 · Page Not Found | Tawny Flor</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #34313d;
      --muted: #716c7b;
      --paper: #fff;
      --lavender: #aaa6df;
      --pink: #e7a0aa;
      --peach: #efbd91;
      --yellow: #f1d98b;
      --green: #a5cfb4;
      --blue: #9fc7e9;
      --violet: #c5a5dc;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #fbfaff; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 18px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 16%, #fceef1 0, transparent 25rem),
        radial-gradient(circle at 88% 82%, #eef5fc 0, transparent 27rem),
        #fbfaff;
      font-family: "Nunito", "Trebuchet MS", Arial, sans-serif;
    }
    main {
      width: min(100%, 620px);
      padding: clamp(28px, 7vw, 58px);
      text-align: center;
      background: var(--paper);
      border: 1px solid #e6e1ec;
      border-top: 5px solid transparent;
      border-image: linear-gradient(90deg, var(--pink), var(--peach), var(--yellow), var(--green), var(--blue), var(--lavender), var(--violet)) 1;
      box-shadow: 0 14px 42px rgb(69 55 91 / 7%);
    }
    .flower {
      width: 92px;
      height: 92px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border: 2px dashed #d8c9e8;
      border-radius: 50%;
      background: #faf6ff;
      font-size: 43px;
      line-height: 1;
    }
    .eyebrow {
      text-align: center;
      color: #8375a8;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: #5c527b;
      font-size: clamp(3.8rem, 16vw, 6.2rem);
      line-height: 1;
      letter-spacing: -.06em;
    }
    h2 {
      margin: 14px 0 12px;
      font-size: clamp(1.35rem, 5vw, 1.8rem);
      font-weight: 800;
    }
    p {
      max-width: 410px;
      margin: 0 auto;
      color: var(--muted);
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 1.08rem;
      line-height: 1.7;
    }
    .rule {
      width: min(100%, 230px);
      height: 3px;
      margin: 25px auto;
      background: linear-gradient(90deg, var(--pink), var(--peach), var(--yellow), var(--green), var(--blue), var(--lavender), var(--violet));
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }
    .actions a {
      min-height: 46px;
      padding: 12px 19px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--lavender);
      border-radius: 8px;
      color: #514477;
      background: #f7f1fc;
      font-size: .95rem;
      font-weight: 800;
      text-decoration: none;
    }
    .actions a.primary {
      border-color: #a5cfb4;
      color: #315c43;
      background: #eff8f1;
    }
    .actions a:hover { filter: brightness(.97); text-decoration: underline; text-underline-offset: 3px; }
    .actions a:focus-visible { outline: 3px solid #6756a8; outline-offset: 3px; }
    .signature {
      margin-top: 30px;
      color: #9a94a5;
      font-size: .82rem;
      letter-spacing: .04em;
    }
    @media (max-width: 420px) {
      .actions { flex-direction: column; }
      .actions a { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <div class="flower" aria-hidden="true">✿</div>
    <p class="eyebrow">A little detour</p>
    <h1>404</h1>
    <h2>Oh! This page wandered off.</h2>
    <p>The link may be broken, or the page may have moved. Let's help you find your way back to Tawny Flor.</p>
    <div class="rule" aria-hidden="true"></div>
    <div class="actions">
      <a class="primary" href="/">⌂ Back to homepage</a>
      <a href="javascript:history.back()">← Go back</a>
    </div>
    <div class="signature">♡ Thanks for stopping by · Tawny Flor</div>
  </main>
</body>
</html>
